# ==============================================================================
# aMenuVerse Production Nginx Load Balancer & Reverse Proxy Configuration
# ==============================================================================

# 1. Upstream Cluster (Load Balances across Node.js / PM2 worker processes)
upstream amenuverse_cluster {
    # Load balancing algorithms available:
    # - default: Round Robin
    # - least_conn: Routes to the instance with fewest active connections
    # - ip_hash: Session persistence by client IP
    least_conn;

    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
    # If running multiple isolated ports:
    # server 127.0.0.1:3001 max_fails=3 fail_timeout=10s;
    # server 127.0.0.1:3002 max_fails=3 fail_timeout=10s;

    keepalive 64;
}

# 2. Rate Limiting Zones (DDoS & Brute Force Protection)
limit_req_zone $binary_remote_addr zone=amenuverse_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=amenuverse_auth:10m rate=5r/s;

# 3. HTTP Server (Redirect all HTTP traffic to HTTPS)
server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com *.yourdomain.com;

    # ACME Challenge for Let's Encrypt SSL
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 4. HTTPS Server (Production Load Balancer & Reverse Proxy)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yourdomain.com *.yourdomain.com;

    # SSL Certificates (Update with your actual certificate paths)
    # ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;

    # SSL Security Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Gzip Compression for Fast Loading
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Max upload size for food photos & restaurant assets
    client_max_body_size 15M;

    # Static Assets Caching (Next.js static files)
    location /_next/static/ {
        proxy_pass http://amenuverse_cluster;
        proxy_cache_valid 200 365d;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Public static media files
    location /public/ {
        proxy_pass http://amenuverse_cluster;
        proxy_cache_valid 200 30d;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # Real-Time SSE / WebSocket Endpoint (Waiter Calls, KDS Alerts)
    location /api/realtime {
        proxy_pass http://amenuverse_cluster;
        proxy_http_version 1.1;

        # Disable buffering for real-time Server-Sent Events
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        chunked_transfer_encoding on;
    }

    # Authentication API Rate Limiting
    location /api/auth {
        limit_req zone=amenuverse_auth burst=10 nodelay;
        proxy_pass http://amenuverse_cluster;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # General Traffic Proxy Pass
    location / {
        limit_req zone=amenuverse_api burst=50 nodelay;
        proxy_pass http://amenuverse_cluster;
        proxy_http_version 1.1;

        # Standard Forwarding Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
